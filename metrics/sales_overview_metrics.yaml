# Metrics view YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/metrics-views
# This file was generated using AI.

version: 1
type: metrics_view

display_name: Sales Overview Metrics
model: sales_overview
timeseries: orderdate

dimensions:
  - name: shipping_country
    display_name: Shipping Country
    column: shipping_country
    description: Country of order delivery

  - name: shipping_region
    display_name: Shipping Region
    column: shipping_region
    description: Region  of order delivery

  - name: shipping_city
    display_name: Shipping City
    column: shipping_city
    description: City of order delivery

  - name: shipping_postalcode
    display_name: Shipping Postalcode
    column: shipping_postalcode
    description: Postal or ZIP code of order delivery

  - name: productname
    display_name: Productname
    column: productname
    description: Name of the product ordered

  - name: categoryname
    display_name: Categoryname
    column: categoryname
    description: Product category

  - name: category_description
    display_name: Category Description
    column: category_description
    description: Detailed description of the product category

  - name: customerid
    display_name: Customerid
    column: customerid
    description: Unique identifier for the customer

  - name: customer_name
    display_name: Customer Name
    column: customer_name
    description: Name of the customer or company

  - name: customer_type
    display_name: Customer Type
    column: customer_type
    description: Type of customer (Wholesale, Retail, White Label, Government)

  - name: RFM_segments
    display_name: Rfm Segments
    column: RFM_segments
    description: Customer segmentation based on Recency, Frequency, and Monetary value

  - name: predicted_churn_category
    display_name: Predicted Churn Category
    column: predicted_churn_category
    description: Likelihood of customer churn (e.g., High Risk, Low Risk)

  - name: employee_name
    display_name: Employee Name
    column: employee_name
    description: Assigned sales representative

  - name: territory_name
    display_name: Territory Name
    column: territorydescription
    description: Sales territory

  - name: territory_region
    display_name: Territory Region
    column: regiondescription
    description: Region of the sales territory

  - name: shipper_name
    display_name: Shipper Name
    column: shipper_name
    description: Shipping company used to deliver the order

  - name: supplier_name
    display_name: Supplier Name
    column: supplier_name
    description: Vendor or manufacturer who supplied the product

measures:
  - name: total_orders_measure
    display_name: Total Orders
    expression: COUNT(orderid)
    description: Total number of orders in the sales overview table.
    format_preset: humanize

  - name: total_quantity_sold_measure
    display_name: Total Quantity Sold
    expression: SUM(total_quantity)
    description: Sum of all product quantities sold across all orders.
    format_preset: humanize

  - name: total_revenue
    display_name: Total Revenue
    expression: SUM(total_revenue)
    description: Total revenue generated from all sales.
    format_preset: humanize

  - name: average_order_revenue_measure
    display_name: Average Revenue
    expression: AVG(total_revenue)
    description: Average revenue per order.
    format_preset: humanize
  
  - expression: SUM(total_discount)
    name: sum_of_total_discount
    display_name: Total Discount
    format_preset: none
    valid_percent_of_total: true
  
  - expression: AVG(total_discount)
    name: avg_of_total_discount
    display_name: Average Discount
    format_preset: none
    valid_percent_of_total: true
  
  - expression: SUM(total_cost)
    name: sum_of_total_cost
    display_name: Total Cost
    format_preset: none
    valid_percent_of_total: true
  
  - expression: SUM(total_cost)
    name: avg_of_total_cost
    format_preset: none
    valid_percent_of_total: true
    display_name: Average Total Cost

  - name: total_shipping_cost_measure
    display_name: Total Shipping Cost
    expression: SUM(shipping_cost)
    description: Total shipping costs incurred for all orders.
    format_preset: humanize
  
  - expression: SUM(shipping_cost)
    name: avg_of_shipping_cost
    display_name: Average Shipping Cost
    format_preset: none
    valid_percent_of_total: true

  - name: average_order_processing_time_measure
    display_name: Average Order Processing Time
    expression: AVG(order_processing_time)
    description: Average time taken to process an order.
    format_preset: humanize

  - name: total_profit
    display_name: Total Profit
    expression: SUM(total_profit)
    description: Total profit generated from all sales.
    format_preset: humanize

  - name: average_order_profit_measure
    display_name: Average Order Profit
    expression: AVG(total_profit)
    description: Average profit per order.
    format_preset: humanize
  
  - name: profit_margin
    display_name: Profit Margin
    requires: [total_profit, total_revenue]

    expression: total_profit / total_revenue
    description: Profit Margin %
    format_preset: percentage
  
  
  - expression: COUNT(DISTINCT customerid)
    name: "# Total Customers"
    format_preset: none
    valid_percent_of_total: false
smallest_time_grain: day
